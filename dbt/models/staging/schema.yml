version: 2
models:
  - name: stg_transactions
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: amount
        tests: [not_null]
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['POS', 'ECOM', 'CONTACTLESS', 'ATM']
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
      - name: merchant_id
        tests:
          - relationships:
              arguments: {to: ref('stg_merchants'), field: merchant_id}
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: stg_merchants
    columns:
      - name: merchant_id
        tests: [unique, not_null]
